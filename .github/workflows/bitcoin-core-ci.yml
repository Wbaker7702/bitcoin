name: Bitcoin Core CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libtool \
          autotools-dev \
          automake \
          pkg-config \
          bsdmainutils \
          python3 \
          libboost-all-dev \
          libssl-dev \
          libevent-dev \
          libsqlite3-dev \
          libzmq3-dev \
          libminiupnpc-dev \
          libnatpmp-dev
    
    - name: Generate build files
      run: ./autogen.sh
      
    - name: Configure
      run: |
        ./configure \
          --disable-wallet \
          --disable-bench \
          --without-gui \
          --without-miniupnpc \
          --disable-fuzz-binary
    
    - name: Build main binaries
      run: make -j$(nproc)
      
    - name: Verify binaries
      run: |
        ./bitcoind --version
        ./bitcoin-cli --version
        
    - name: Build tests
      run: make check -j$(nproc)
      continue-on-error: true
      
    - name: Run unit tests
      run: |
        if [ -f src/test_bitcoin ]; then
          src/test_bitcoin --log_level=test_suite
        else
          echo "Test binary not found, skipping tests"
        fi
      continue-on-error: true
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: bitcoin-binaries
        path: |
          bitcoind
          bitcoin-cli
          bitcoin-tx
          bitcoin-util
        retention-days: 7
        
    - name: Upload test logs
      uses: actions/upload-artifact@v3
      if: failure()
      with:
        name: test-logs
        path: |
          **/*.log
        retention-days: 14

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Check formatting
      run: |
        echo "Code formatting check would go here"
        # Add clang-format or similar checks
        
    - name: Static analysis
      run: |
        echo "Static analysis would go here"
        # Add cppcheck or similar tools

  documentation:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Check documentation
      run: |
        echo "Checking documentation files exist..."
        test -f BUILD_SUMMARY.md || exit 1
        test -f CODE_REVIEW.md || exit 1
        test -f DEVELOPMENT_PLAN.md || exit 1
        test -f TEST_FIXES_SUMMARY.md || exit 1
        echo "✅ All documentation files present"
